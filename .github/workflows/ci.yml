name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (core + dev extras only — no workspace needed)
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests examples
      - name: Tests
        run: pytest -q
      - name: Evals (deterministic mock model — a failure is a regression)
        run: PYTHONPATH=src:. python examples/run_evals.py
      - name: Demo smoke test
        run: PYTHONPATH=src:. python examples/workspace_insight_agent.py > /dev/null
